plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.admobads'
version = '0.1.0'

android {
  namespace "expo.modules.admobads"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Google Mobile Ads SDK. Rewarded INTERSTITIAL needs 19.2.0+.
  //
  // PINNED TO 24.6.0, not the newest (25.x): 25.5.0 ships Kotlin 2.3
  // metadata and this project's Kotlin compiler reads 2.1, so every 25.x
  // build fails with "Module was compiled with an incompatible version of
  // Kotlin" (verified — do not bump without bumping the project Kotlin
  // first). 24.6.0 is also the version this app used before the Unity
  // switch, so it is the one already known to build here, and it is far
  // above the 19.0.0 floor for AdMob on Google's Families
  // Self-Certified Ads SDK list.
  //
  // It is the format that matters, not the version: a plain REWARDED unit
  // cannot be closed inside 5 seconds (that is what got v1.0.10
  // rejected), whereas a rewarded INTERSTITIAL only serves skippable ads.
  //
  // The AAR merges `<uses-permission com.google.android.gms.permission.
  // AD_ID>`; ./plugins/withNoAdId.js strips it again at prebuild so no ad
  // code can read an advertising identifier (guardrail 6).
  implementation 'com.google.android.gms:play-services-ads:24.6.0'
}
