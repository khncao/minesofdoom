# E2E screenshot flow (todo: "4 in-game screenshots in various states per
# device"): drives a FRESH install through the four canonical UI states and
# captures each with takeScreenshot.
#
# The filename is prefixed `00_` so Maestro runs this flow FIRST when given
# the whole flows dir — the onboarding overlay only appears on the very first
# launch of a fresh install, and shot 1 needs it. The repeat/while guard
# keeps the flow safe on non-fresh installs (overlay already dismissed →
# shot 1 is skipped, the other three are still captured).
#
# Screenshots land under build/maestro/screenshots/<test-name>/; the
# e2e-android.yml matrix job uploads build/maestro per device (reports +
# screenshots together).
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# State 1/4 — the onboarding overlay on a fresh install. The overlay mounts
# just after the main screen, so assertVisible polls until it appears; on
# non-fresh installs the shot is just the main screen and the tap no-ops
# (optional/when).
- assertVisible:
    id: onboarding-overlay
    optional: true
- takeScreenshot: 01_onboarding
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# State 2/4 — mid-mine: a few long-press mines so the counters read non-zero
# (same longPressOn rationale as mining.yaml — a plain tapOn is a
# deliberate no-op by design).
- repeat:
    times: 3
    commands:
      - longPressOn:
          id: mining-canvas

# Let the floating "+N" text and debris settle before the shot.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_mining.png

# State 3/4 — the upgrades panel (open by default; asserting a buy button
# proves the section is actually rendered, not just its toggle header).
- assertVisible:
    id: btn-upgrade-power
- takeScreenshot: 03_upgrades.png

# State 4/4 — the settings sheet, open.
- tapOn:
    id: menu-button
- assertVisible:
    id: menu-sheet
- assertVisible:
    id: settings-view
- takeScreenshot: 04_settings.png

# Leave the sheet closed for the flows that run after this one.
- tapOn:
    id: menu-sheet-close
- assertNotVisible:
    id: menu-sheet
