# E2E boot-up check (Android): the app launches, the save loads, the main
# game UI renders, and a crash/error screen is nowhere in sight.
#
# Selectors are testIDs added to the components (see src/mines_of_doom/
# components/*). Text-based selectors can't be used for the equation (the
# numbers are random) or most chrome (emoji), so testIDs are the anchors.
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# First launch shows the onboarding overlay; tap Skip to dismiss it. The
# overlay mounts just after the main screen, so assertVisible polls until it
# appears; on repeat launches (overlay never comes) the assert times out and
# both steps no-op via optional: true.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

# Proper boot = past the loading screen, onto the main game UI.
# (assertVisible waits, so these also cover the slow cold-bundle start.)
- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count  # depth-banner excluded: native view renders but never
  # paints on phone layouts (see docs/blockers.md — depth-banner layout bug)

# ...and the loading / onboarding layers are gone.
- assertNotVisible:
    id: loading-screen
- assertNotVisible:
    id: onboarding-overlay
