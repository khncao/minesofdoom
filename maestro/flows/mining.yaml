# E2E mining check (Android): hold-to-mine on the cave canvas actually
# credits minerals and the game UI stays stable (no crash screen).
#
# Mining is a >=300ms hold (MINE_HOLD_MS in MiningCanvas.tsx) and a quick
# tapOn is a deliberate no-op by design, so the flow uses longPressOn —
# Maestro's built-in 3s hold gesture, which always clears the threshold and
# yields exactly one mine per press.
#
# Selectors are testIDs added to the components (mineral-count in
# MiningCanvas.tsx). The counter is read with copyTextFrom (text lands in
# maestro.copiedText) and compared in a JS expression, because the mineral
# value is dynamic.
#
# The counter is parsed out of its COMPACT display form ("36.3k" past
# ~10k), so this flow works on a save that has been played for a while.
# The assert compares the DISPLAYED, rounded counter — on an aged/inflated save
# (e.g. 1.11M) five mines never move the display and the flow fails
# spuriously. Triage of exactly that failure: docs/blockers.md
# ("mining flow's minerals assert" — RESOLVED, no app bug).
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding overlay guard (first launch only) — see boot_up.yaml for the
# optional/when rationale.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# Baseline (a fresh install is 0; later flows on the same install may not
# be, hence the numeric comparison instead of an equality assert).
- copyTextFrom:
    id: mineral-count
# The displayed counter is COMPACT ("36.3k", "3.4M", "1.2B") once the
# save passes ~10k, so a comma-stripping Number() reads NaN and every
# numeric assert silently fails. parse() handles both forms.
- evalScript: ${output.mineralsBefore = Number(maestro.copiedText.split(",").join("").replace("k", "e3").replace("K", "e3").replace("m", "e6").replace("M", "e6").replace("b", "e9").replace("B", "e9"))}
- repeat:
    times: 5
    commands:
      - longPressOn:
          id: mining-canvas

- copyTextFrom:
    id: mineral-count
# The displayed counter is COMPACT ("36.3k", "3.4M", "1.2B") once the
# save passes ~10k, so a comma-stripping Number() reads NaN and every
# numeric assert silently fails. parse() handles both forms.
- evalScript: ${output.mineralsAfter = Number(maestro.copiedText.split(",").join("").replace("k", "e3").replace("K", "e3").replace("m", "e6").replace("M", "e6").replace("b", "e9").replace("B", "e9"))}
- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count
- assertVisible:
    id: depth-banner
