# E2E mining check (Android): hold-to-mine on the cave canvas actually
# credits minerals and the game UI stays stable (no crash screen).
#
# Mining is a >=300ms hold (MINE_HOLD_MS in MiningCanvas.tsx) and a quick
# tapOn is a deliberate no-op by design, so the flow uses longPressOn —
# Maestro's built-in 3s hold gesture, which always clears the threshold and
# yields exactly one mine per press.
#
# Selectors are testIDs added to the components (mineral-count in
# MiningCanvas.tsx). The counter is read with copyTextFrom (text lands in
# maestro.copiedText) and compared in a JS expression, because the mineral
# value is dynamic.
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding overlay guard (first launch only) — see boot_up.yaml for the
# optional/when rationale.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# Baseline (a fresh install is 0; later flows on the same install may not
# be, hence the numeric comparison instead of an equality assert).
- copyTextFrom:
    id: mineral-count
- evalScript: ${output.mineralsBefore = maestro.copiedText}

# 5 hold-to-mines in the cave.
- repeat:
    times: 5
    commands:
      - longPressOn:
          id: mining-canvas

- copyTextFrom:
    id: mineral-count
- evalScript: ${output.mineralsAfter = maestro.copiedText}
- assertTrue:
    condition: ${Number(output.mineralsAfter.replace(/,/g, "")) > Number(output.mineralsBefore.replace(/,/g, ""))}
    label: "minerals increased after 5 long-press mines (${output.mineralsBefore} -> ${output.mineralsAfter})"

# ...and the main UI is still alive afterwards.
- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count  # depth-banner excluded: native view renders but never
  # paints on phone layouts (see docs/blockers.md — depth-banner layout bug)
