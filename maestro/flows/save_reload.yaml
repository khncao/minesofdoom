# E2E save/reload check (Android): earn minerals, save via the footer save
# pill, kill the app, relaunch — the loaded save must show the SAME
# mineral count, proving the save was written and read back.
#
# This relies on a miner-free save (a fresh install in CI): with zero
# miners there is no offline income, so the count is stable across the
# kill/relaunch. If a future flow buys miners first, this flow's assert
# would need an "offline earnings are additive" check instead.
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

- repeat:
    while:
      visible:
        id: onboarding-overlay
    times: 1
    commands:
      - tapOn:
          id: onboarding-skip

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# Earn a characteristic amount.
- loop:
    - touchDown:
        id: mining-canvas
    - sleep: 400
    - touchUp:
        id: mining-canvas
  times: 6

- extract:
    variable: minerals_before
    from:
      id: mineral-count
    regex: "([0-9][0-9,]*)"

# Explicit save (autosave would eventually write it too, but the pill is
# the first-class path this flow is meant to exercise).
- tapOn:
    id: save-pill

# Give the AsyncStorage write a beat before the hard kill — the save is
# an async setItem and a slow CI emulator could still be mid-write.
- sleep: 1000

# Kill the process and boot cold again.
- stopApp: com.minus4kelvin.minesofdoom
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding never resurfaces (it persists on first dismiss); the repeat
# block is a no-op here but keeps the flow safe against fresh installs.
- repeat:
    while:
      visible:
        id: onboarding-overlay
    times: 1
    commands:
      - tapOn:
          id: onboarding-skip

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

- extract:
    variable: minerals_after
    from:
      id: mineral-count
    regex: "([0-9][0-9,]*)"

- script: |
    val before = extract("minerals_before")
    val after = extract("minerals_after")
    assert(before != null && after != null, "missing mineral counts")
    assert(before == after, "minerals changed across save/reload: $before -> $after")

# And no loading screen is stuck on top.
- assertNotVisible:
    id: loading-screen
