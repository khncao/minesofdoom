# E2E save/reload check (Android): earn minerals, save via the footer save
# pill, kill the app, relaunch — the loaded save must show the SAME
# mineral count, proving the save was written and read back.
#
# On a miner-free save (the CI premise) the count is IDENTICAL across the
# kill/relaunch. Once the save has miners, the relaunch credits offline
# income, so the assert is "never fewer" — the additive case this flow's
# original comment anticipated. Either way a DROP means the save was not
# written or came back stale, which is the bug this flow exists to catch.
#
# The counter is read COMPACTLY: past ~10k the UI shows "36.3k", so a
# comma-stripping Number() reads NaN and the numeric assert below fails on
# any save that has been played for a while. The parse handles both forms,
# which is what makes this flow runnable in sequence with the others.
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding overlay guard (first launch only) — see boot_up.yaml for the
# optional/when rationale.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# Earn a characteristic amount.
- repeat:
    times: 6
    commands:
      - longPressOn:
          id: mining-canvas

- copyTextFrom:
    id: mineral-count
# The displayed counter is COMPACT ("36.3k", "3.4M", "1.2B") once the
# save passes ~10k, so a comma-stripping Number() reads NaN and every
# numeric assert silently fails. parse() handles both forms.
- evalScript: ${output.mineralsBefore = Number(maestro.copiedText.split(",").join("").replace("k", "e3").replace("K", "e3").replace("m", "e6").replace("M", "e6").replace("b", "e9").replace("B", "e9"))}
- assertTrue:
    condition: ${output.mineralsBefore > 0}
    label: "mined some minerals before saving (${maestro.copiedText})"

# Explicit save (autosave would eventually write it too, but the pill is
# the first-class path this flow is meant to exercise).
- tapOn:
    id: save-pill

# The write is an async setItem — a hard kill mid-write would lose the
# save. useGameEngine clears saveDirty in the .then() of the write, which
# flips the pill's accessibility label off "Save game (unsaved changes)",
# so waiting for that label to disappear is a real sync point, not a sleep.
- extendedWaitUntil:
    notVisible:
      text: "Save game \\(unsaved changes\\)"
    timeout: 5000

# Kill the process and boot cold again.
- stopApp: com.minus4kelvin.minesofdoom
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding never resurfaces (it persists on first dismiss); the guard
# below is a no-op here but keeps the flow safe against fresh installs.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

- copyTextFrom:
    id: mineral-count
# Compare the PARSED value, not the display string: the counter is
# compact-formatted, so "46.4k" and 46400 are the same amount and the
# string comparison this used to do could only ever fail on a big save.
- evalScript: ${output.mineralsAfter = Number(maestro.copiedText.split(",").join("").replace("k", "e3").replace("K", "e3").replace("m", "e6").replace("M", "e6").replace("b", "e9").replace("B", "e9"))}
# Equal on a miner-free save (the CI premise); ADDITIVE once the save has
# miners, because the relaunch credits offline income — the original flow
# comment's own "if a future flow buys miners first" case. What must never
# happen is minerals going DOWN: that would mean the save was not written
# or was read back stale.
- assertTrue:
    condition: ${output.mineralsAfter >= output.mineralsBefore}
    label: "minerals survived save/reload (${output.mineralsBefore} -> ${output.mineralsAfter})"

# And no loading screen is stuck on top.
- assertNotVisible:
    id: loading-screen
