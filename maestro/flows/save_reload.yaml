# E2E save/reload check (Android): earn minerals, save via the footer save
# pill, kill the app, relaunch — the loaded save must show the SAME
# mineral count, proving the save was written and read back.
#
# This relies on a miner-free save (a fresh install in CI): with zero
# miners there is no offline income, so the count is stable across the
# kill/relaunch. If a future flow buys miners first, this flow's assert
# would need an "offline earnings are additive" check instead.
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding overlay guard (first launch only) — see boot_up.yaml for the
# optional/when rationale.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

# Earn a characteristic amount.
- repeat:
    times: 6
    commands:
      - longPressOn:
          id: mining-canvas

- copyTextFrom:
    id: mineral-count
- evalScript: ${output.mineralsBefore = maestro.copiedText}
- assertTrue:
    condition: ${Number(output.mineralsBefore.replace(/,/g, "")) > 0}
    label: "mined some minerals before saving (${output.mineralsBefore})"

# Explicit save (autosave would eventually write it too, but the pill is
# the first-class path this flow is meant to exercise).
- tapOn:
    id: save-pill

# The write is an async setItem — a hard kill mid-write would lose the
# save. useGameEngine clears saveDirty in the .then() of the write, which
# flips the pill's accessibility label off "Save game (unsaved changes)",
# so waiting for that label to disappear is a real sync point, not a sleep.
- extendedWaitUntil:
    notVisible:
      text: "Save game \\(unsaved changes\\)"
    timeout: 5000

# Kill the process and boot cold again.
- stopApp: com.minus4kelvin.minesofdoom
- launchApp: com.minus4kelvin.minesofdoom

# Onboarding never resurfaces (it persists on first dismiss); the guard
# below is a no-op here but keeps the flow safe against fresh installs.
- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip

    optional: true

- assertVisible:
    id: equation-display
- assertVisible:
    id: mineral-count

- copyTextFrom:
    id: mineral-count
- assertTrue:
    condition: ${output.mineralsBefore !== null && maestro.copiedText === output.mineralsBefore}
    label: "minerals identical across save/reload (${output.mineralsBefore} -> ${maestro.copiedText})"

# And no loading screen is stuck on top.
- assertNotVisible:
    id: loading-screen
