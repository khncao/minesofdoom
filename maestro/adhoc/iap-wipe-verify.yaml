# Ad-hoc (on-device, debug APK with the embedded PRODUCTION bundle from
# HEAD, which includes reconcileStore, a50aea0): the wipe leg of the
# "iap not persisting" fix. Run AFTER
# `adb shell pm clear com.minus4kelvin.minesofdoom`.
#
# The wiped app has no local entitlement rows, but the license tester's
# purchase persists in the STORE record (the purchase leg was confirmed
# on this AVD). reconcileStore() runs once, silently, at launch and must
# re-derive the entitlement from the store record, so the panel should
# settle back to "Owned" — not stay "Buy". Needs the Play billing
# network (queryProductDetails + getAvailablePurchases).
appId: com.minus4kelvin.minesofdoom
---
- launchApp: com.minus4kelvin.minesofdoom

- assertVisible:
    id: onboarding-skip
    optional: true
- tapOn:
    id: onboarding-skip
    optional: true

- assertVisible:
    id: equation-display

# Open the IAP panel: the catalog must render...
- tapOn:
    text: "🛍️"
- assertVisible:
    text: "One-time purchases"

# ...and after reconcileStore replays the store record, ownership must
# be re-derived (async — give it a generous window; this is the whole
# point of the fix).
- assertVisible:
    text: "Owned"
    retryIntervalMilliseconds: 3000
    timeoutMilliseconds: 90000

- takeScreenshot:
    path: iap-wipe-recovered.png
